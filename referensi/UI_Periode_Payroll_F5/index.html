<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prototype Periode Payroll F-5</title><style>
:root{--canvas:#F5F7FA;--ink:#243247;--muted:#647A9D;--line:#DDE5F1;--blue:#2458D3;--red:#B32632;--green:#25704A}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.45 Inter,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:6px;padding:9px 12px;color:var(--ink)}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button:disabled{opacity:.6;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8AB0FF;outline-offset:2px}.demo{height:31px;padding:6px 8px;background:#EDF3FF;color:var(--blue);font-size:11px;display:flex;gap:20px}.shell{display:grid;grid-template-columns:208px 1fr;min-height:calc(100vh - 31px)}aside{background:white;padding:16px;display:flex;flex-direction:column}.brand{display:flex;gap:12px;align-items:center}.brand>b{font-size:24px;color:var(--blue)}small{font-size:11px;color:var(--muted)}.group{margin:20px 0 8px;font-size:11px;color:var(--muted)}nav{display:grid;gap:8px}nav span{padding:11px 20px;color:var(--muted)}nav .active{background:#EDF3FF;color:var(--blue)}aside>small{margin-top:auto;padding-top:40px}.workspace{min-width:0}.top{height:49px;background:white;display:flex;justify-content:space-between;align-items:center;padding:0 16px;font-size:11px}.top>span:first-child{color:var(--muted)}main{padding:24px;max-width:1180px}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}h1{font-size:24px;line-height:34px;font-weight:600;margin:0 0 4px}h2{font-size:16px;font-weight:600;margin:0}.panel{background:white;border:1px solid var(--line);border-radius:6px;overflow:hidden}.panel-head{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.badge{background:#EDF3FF;color:var(--blue);padding:3px 8px;font-size:12px;border-radius:4px}.fields{padding:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}label{display:block;margin-bottom:8px}input,select{display:block;width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 12px;min-height:40px;color:var(--ink);background:white}input[readonly]{background:var(--canvas)}input[aria-invalid=true]{border-color:var(--red)}.error{font-size:12px;color:var(--red);margin:6px 0 0;min-height:0}.actions{border-top:1px solid var(--line);padding:16px;display:flex;justify-content:space-between;gap:16px;align-items:center}.buttons{display:flex;gap:8px}.feedback{font-size:14px;color:var(--green);margin:0 0 16px}.footer{display:flex;justify-content:space-between;gap:16px;margin-top:16px}.picker{max-width:280px;margin-bottom:16px}.picker label{font-size:12px;color:var(--muted)}.gallery{margin-top:36px;border-top:1px solid var(--line);padding-top:18px}.gallery summary{cursor:pointer;color:var(--muted);font-size:12px}.gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}.gallery img{width:100%;display:block;border:1px solid var(--line)}.gallery a{font-size:12px;color:var(--blue);text-decoration:none}.gallery p{margin:6px 0}.live{position:absolute;left:-10000px} @media(max-width:800px){.shell{grid-template-columns:160px 1fr}.fields{grid-template-columns:1fr}.actions{align-items:flex-start;flex-direction:column}.gallery-grid{grid-template-columns:1fr}.top>span:last-child{display:none}}@media(max-width:540px){.shell{display:block}aside{display:none}main{padding:18px}.heading{flex-wrap:wrap}.buttons{flex-wrap:wrap}.demo span{display:none}}
</style></head><body><div class="demo">PROTOTYPE · Data contoh <span>Payroll &nbsp; Admin &nbsp; Approver &nbsp; Karyawan &nbsp; PM &nbsp; Keuangan &nbsp; Manajemen</span></div><div class="shell"><aside><div class="brand"><b>A</b><div>Anaheim Nimbus<br><small>UNIVERSAL · ERP</small></div></div><div class="group">PAYROLL & PEMBAYARAN</div><nav><span class="active">Periode payroll</span><span>Komponen gaji</span><span>Perhitungan gaji</span><span>Penerbitan slip</span></nav><small>Kelompok 5 · Kelas F</small></aside><div class="workspace"><header class="top"><span id="breadcrumb">Payroll & pembayaran / Periode payroll</span><span>Petugas payroll · Sesi demo</span></header><main id="main"></main></div></div><div class="live" id="live" role="status" aria-live="polite"></div><script>
(function(root){
const initial={id:'periode-contoh-01',start:'2026-09-01',end:'2026-09-30',pay:'2026-10-01'};
let records=[{...initial}];
function validDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+'T00:00:00Z');return Number.isFinite(d.valueOf())&&d.toISOString().slice(0,10)===s;}
function validate(v){const errors={};for(const [k,label] of [['start','Tanggal mulai'],['end','Tanggal akhir'],['pay','Tanggal pembayaran']]){if(!v[k])errors[k]=label+' wajib diisi.';else if(!validDate(v[k]))errors[k]=label+' tidak valid.';}if(!errors.start&&!errors.end&&v.end<v.start)errors.end='Tanggal akhir tidak boleh sebelum tanggal mulai.';return errors;}
function save(v,id){const errors=validate(v);if(Object.keys(errors).length)return {ok:false,errors};if(id&&!records.some(r=>r.id===id))return {ok:false,errors:{form:'Periode tidak ditemukan.'}};const item={id:id||'periode-contoh-'+(records.length+1),start:v.start,end:v.end,pay:v.pay};if(id)records=records.map(r=>r.id===id?item:r);else records.push(item);return {ok:true,item:{...item}};}
const api={validate,save,list:()=>records.map(r=>({...r})),get:id=>{const r=records.find(r=>r.id===id);return r?{...r}:null;},reset:()=>{records=[{...initial}];}};
if(typeof module!=='undefined'&&module.exports)module.exports=api;else root.periodModel=api;
})(typeof window!=='undefined'?window:globalThis);
</script><script>
const model=window.periodModel;let selected=model.list()[0].id,mode='view',editing=null,feedback='';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const labels={start:'Tanggal mulai',end:'Tanggal akhir',pay:'Tanggal pembayaran'};const month=v=>new Intl.DateTimeFormat('id-ID',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T00:00:00Z'));
function render(){const item=model.get(selected),edit=mode!=='view';const v=edit?editing:item;const title=mode==='create'?'Tambah periode':mode==='edit'?'Edit periode':'Periode payroll';document.getElementById('breadcrumb').textContent='Payroll & pembayaran / '+title;document.getElementById('main').innerHTML=`<div class="heading"><div><h1>${title}</h1><small>${edit?'Isi tanggal dan simpan perubahan periode payroll.':'Kelola periode dan siapkan data sebelum menghitung gaji.'}</small></div>${edit?'':'<button class="primary" id="new">+ Periode baru</button>'}</div>${feedback?'<p class="feedback" role="status">'+esc(feedback)+'</p>':''}${edit?'':'<div class="picker"><label for="period">Periode</label><select id="period">'+model.list().map(r=>'<option value="'+r.id+'" '+(r.id===selected?'selected':'')+'>'+month(r.start)+'</option>').join('')+'</select></div>'}<form id="form" novalidate><section class="panel"><div class="panel-head"><h2>${edit?'Data periode':month(item.start)}</h2><span class="badge">Draf</span></div><div class="fields">${Object.entries(labels).map(([k,l])=>`<div><label for="${k}">${l}</label><input type="date" id="${k}" name="${k}" value="${esc(v[k])}" ${edit?'required':'readonly'} aria-describedby="${k}-error"><p class="error" id="${k}-error"></p></div>`).join('')}</div><div class="actions"><small>${edit?'Semua kolom wajib diisi.':'Periode tersimpan dengan status Draf.'}</small><div class="buttons">${edit?'<button type="button" id="cancel">Batal</button><button type="submit" class="primary" id="save">'+(mode==='create'?'Simpan periode':'Simpan perubahan')+'</button>':'<button type="button" id="edit">Ubah periode</button>'}</div></div></section></form><div class="footer"><small>Seluruh nama, tanggal, dan angka adalah data contoh.</small><small>UI-K05-01</small></div><details class="gallery"><summary>Lihat rancangan layar untuk Figma</summary><div class="gallery-grid"><a href="svg/UI-K05-01A_Tambah_periode.svg" target="_blank"><img src="svg/UI-K05-01A_Tambah_periode.svg" alt="Tambah periode"><p>01A Tambah periode</p></a><a href="svg/UI-K05-01B_Tambah_periode_terisi.svg" target="_blank"><img src="svg/UI-K05-01B_Tambah_periode_terisi.svg" alt="Tambah periode"><p>01B Tambah periode terisi</p></a><a href="svg/UI-K05-01C_Validasi_kolom_wajib.svg" target="_blank"><img src="svg/UI-K05-01C_Validasi_kolom_wajib.svg" alt="Tambah periode"><p>01C Validasi kolom wajib</p></a><a href="svg/UI-K05-01D_Validasi_urutan_tanggal.svg" target="_blank"><img src="svg/UI-K05-01D_Validasi_urutan_tanggal.svg" alt="Tambah periode"><p>01D Validasi urutan tanggal</p></a><a href="svg/UI-K05-01E_Periode_tersimpan.svg" target="_blank"><img src="svg/UI-K05-01E_Periode_tersimpan.svg" alt="Periode payroll"><p>01E Periode tersimpan</p></a><a href="svg/UI-K05-01F_Edit_periode.svg" target="_blank"><img src="svg/UI-K05-01F_Edit_periode.svg" alt="Edit periode"><p>01F Edit periode</p></a><a href="svg/UI-K05-01G_Edit_periode_terisi.svg" target="_blank"><img src="svg/UI-K05-01G_Edit_periode_terisi.svg" alt="Edit periode"><p>01G Edit periode terisi</p></a><a href="svg/UI-K05-01H_Perubahan_tersimpan.svg" target="_blank"><img src="svg/UI-K05-01H_Perubahan_tersimpan.svg" alt="Periode payroll"><p>01H Perubahan tersimpan</p></a></div></details>`;
document.getElementById('new')?.addEventListener('click',()=>{mode='create';editing={start:'',end:'',pay:''};feedback='';render();document.getElementById('start').focus()});document.getElementById('edit')?.addEventListener('click',()=>{mode='edit';editing={...model.get(selected)};feedback='';render();document.getElementById('start').focus()});document.getElementById('cancel')?.addEventListener('click',()=>{mode='view';editing=null;feedback='';render()});document.getElementById('period')?.addEventListener('change',e=>{selected=e.target.value;feedback='';render()});document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();if(mode==='view')return;const v=Object.fromEntries(Object.keys(labels).map(k=>[k,document.getElementById(k).value]));const result=model.save(v,mode==='edit'?selected:null);for(const k of Object.keys(labels)){document.getElementById(k+'-error').textContent=result.errors?.[k]||'';document.getElementById(k).setAttribute('aria-invalid',result.errors?.[k]?'true':'false');}if(!result.ok){const first=Object.keys(labels).find(k=>result.errors[k]);if(first)document.getElementById(first).focus();document.getElementById('live').textContent='Data belum disimpan. Periksa kolom yang ditandai.';return;}const wasEdit=mode==='edit';selected=result.item.id;mode='view';editing=null;feedback=wasEdit?'Perubahan periode berhasil disimpan.':'Periode berhasil disimpan.';render();});}
render();
</script></body></html>
